<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f103c" />
      <stop offset="50%" stop-color="#120824" />
      <stop offset="100%" stop-color="#090314" />
    </linearGradient>

    <!-- Squircle Border Glow -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Warm Spotlight Cone -->
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Chrome Body Gradient -->
    <linearGradient id="micBodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Chrome Highlight -->
    <linearGradient id="chromeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.5" />
    </linearGradient>

    <!-- Golden Bowtie Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Mouth Depth -->
    <radialGradient id="mouthGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    
    <!-- Cheek Blush -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#squircleBorder)" stroke-width="6" opacity="0.8" />
  
  <!-- Warm Spotlight Atmosphere -->
  <circle cx="256" cy="220" r="210" fill="url(#stageGlow)" />

  <!-- Background Comedy Stars / Sparkles -->
  <g opacity="0.85">
    <!-- Star Top Right -->
    <path d="M 405 95 Q 405 125 435 125 Q 405 125 405 155 Q 405 125 375 125 Q 405 125 405 95 Z" fill="#fbbf24" filter="url(#glow)" />
    <!-- Small Star Top Left -->
    <path d="M 105 130 Q 105 150 125 150 Q 105 150 105 170 Q 105 150 85 150 Q 105 150 105 130 Z" fill="#ec4899" />
    <!-- Star Bottom Left -->
    <circle cx="95" cy="385" r="7" fill="#fbbf24" />
    <circle cx="410" cy="365" r="9" fill="#a855f7" />
    <!-- Laugh / Musical Note -->
    <path d="M 390 230 C 390 215 415 210 420 225 L 420 260 C 415 255 405 255 400 260 C 393 266 395 277 404 280 C 413 283 424 276 424 263 L 424 220 C 424 212 400 212 390 220 Z" fill="#f472b6" opacity="0.75" />
  </g>

  <!-- Mascot Body Group with Shadow -->
  <g filter="url(#softShadow)">
    
    <!-- Microphone Stand Base & Neck -->
    <path d="M 236 345 L 236 415 L 180 445 C 170 450 178 465 190 465 L 322 465 C 334 465 342 450 332 445 L 276 415 L 276 345 Z" fill="#334155" />
    <ellipse cx="256" cy="460" rx="72" ry="12" fill="#1e293b" />
    <rect x="242" y="340" width="28" height="85" rx="6" fill="#64748b" />
    <rect x="246" y="340" width="8" height="85" fill="#94a3b8" opacity="0.6" />

    <!-- Cute Golden Bow Tie -->
    <g transform="translate(256, 350)">
      <!-- Left Wing -->
      <polygon points="0,0 -46,-22 -48,22 0,0" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
      <!-- Right Wing -->
      <polygon points="0,0 46,-22 48,22 0,0" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
      <!-- Center Knot -->
      <ellipse cx="0" cy="0" rx="14" ry="12" fill="#fef08a" stroke="#78350f" stroke-width="2" />
      <ellipse cx="-3" cy="-3" rx="5" ry="4" fill="#ffffff" opacity="0.7" />
    </g>

    <!-- Vintage Microphone Head (Capsule) Outer Pill -->
    <rect x="160" y="100" width="192" height="235" rx="96" fill="url(#micBodyGrad)" stroke="#334155" stroke-width="6" />

    <!-- Microphone Grille Mesh / Horizontal Ribs -->
    <g opacity="0.28" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round">
      <line x1="185" y1="130" x2="327" y2="130" />
      <line x1="172" y1="150" x2="340" y2="150" />
      <line x1="164" y1="170" x2="348" y2="170" />
      <line x1="162" y1="190" x2="350" y2="190" />
      <line x1="164" y1="290" x2="348" y2="290" />
      <line x1="172" y1="310" x2="340" y2="310" />
      <!-- Vertical Arch Band -->
      <line x1="256" y1="102" x2="256" y2="195" stroke-width="4.5" />
    </g>

    <!-- Glossy 3D Highlight on Microphone Dome -->
    <path d="M 180 125 C 205 108 240 106 270 108 C 240 114 210 122 190 145 Z" fill="#ffffff" opacity="0.75" />

    <!-- Cute Rosy Cartoon Cheeks -->
    <circle cx="192" cy="254" r="22" fill="url(#blushGrad)" />
    <circle cx="320" cy="254" r="22" fill="url(#blushGrad)" />

    <!-- Big Expressive Cartoon Eyes -->
    <!-- Left Eye -->
    <g transform="translate(205, 208)">
      <!-- Sclera / Eye Base -->
      <ellipse cx="0" cy="0" rx="26" ry="32" fill="#ffffff" stroke="#1e293b" stroke-width="4" />
      <!-- Big Sparkly Dark Iris -->
      <ellipse cx="2" cy="2" rx="18" ry="24" fill="#0f172a" />
      <!-- Iris Colored Rim -->
      <ellipse cx="2" cy="5" rx="14" ry="18" fill="#3b82f6" opacity="0.8" />
      <ellipse cx="2" cy="4" rx="10" ry="14" fill="#0f172a" />
      <!-- Main Anime/Cartoon Light Sparkle -->
      <ellipse cx="-4" cy="-8" rx="8" ry="11" fill="#ffffff" />
      <!-- Secondary Tiny Sparkle -->
      <circle cx="7" cy="8" r="4" fill="#ffffff" />
    </g>

    <!-- Right Eye -->
    <g transform="translate(307, 208)">
      <!-- Sclera / Eye Base -->
      <ellipse cx="0" cy="0" rx="26" ry="32" fill="#ffffff" stroke="#1e293b" stroke-width="4" />
      <!-- Big Sparkly Dark Iris -->
      <ellipse cx="-2" cy="2" rx="18" ry="24" fill="#0f172a" />
      <!-- Iris Colored Rim -->
      <ellipse cx="-2" cy="5" rx="14" ry="18" fill="#3b82f6" opacity="0.8" />
      <ellipse cx="-2" cy="4" rx="10" ry="14" fill="#0f172a" />
      <!-- Main Anime/Cartoon Light Sparkle -->
      <ellipse cx="-8" cy="-8" rx="8" ry="11" fill="#ffffff" />
      <!-- Secondary Tiny Sparkle -->
      <circle cx="3" cy="8" r="4" fill="#ffffff" />
    </g>

    <!-- Cartoon Eyebrows (Expressive & Happy) -->
    <path d="M 184 165 Q 206 150 228 163" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
    <path d="M 284 163 Q 306 150 328 165" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />

    <!-- Big Happy Cartoon Open Smile with Tongue -->
    <g transform="translate(256, 266)">
      <!-- Mouth Cavity -->
      <path d="M -34 0 Q 0 -6 34 0 C 34 26 22 46 0 46 C -22 46 -34 26 -34 0 Z" fill="url(#mouthGrad)" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round" />
      <!-- Cute Pink Tongue -->
      <path d="M -16 26 C -12 18 12 18 16 26 C 14 38 -14 38 -16 26 Z" fill="#fb7185" />
      <!-- Top Teeth Glimpse -->
      <path d="M -20 0 Q 0 4 20 0 L 16 7 Q 0 10 -16 7 Z" fill="#ffffff" opacity="0.95" />
    </g>

    <!-- Cute Cartoon White Glove Hand Waving (Stage Comedy Vibe) -->
    <g transform="translate(366, 260) rotate(-15)">
      <!-- Glove Palm -->
      <ellipse cx="0" cy="0" rx="20" ry="18" fill="#ffffff" stroke="#1e293b" stroke-width="4" />
      <!-- Fingers -->
      <circle cx="16" cy="-10" r="8" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
      <circle cx="20" cy="4" r="8" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
      <circle cx="15" cy="16" r="8" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
      <!-- Thumb -->
      <ellipse cx="-10" cy="-12" rx="7" ry="10" transform="rotate(-30 -10 -12)" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
      <!-- Glove Cuff -->
      <rect x="-18" y="10" width="22" height="10" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="3" />
      <!-- Glove 3 Classic Dart Lines -->
      <line x1="-3" y1="-4" x2="5" y2="-4" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="-3" y1="1" x2="6" y2="1" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="-3" y1="6" x2="4" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    </g>

  </g>
</svg>
