name: Build StandupLab Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # Автоматически создаем подтверждение всех лицензий Android SDK
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          # Переходим в папку android и собираем проект
          cd android
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK файл не найден после сборки!"
            exit 1
          fi
          echo "Найден APK: $APK_PATH"
          cp "$APK_PATH" output-apk/StandupLab-Android-debug.apk

      - name: Upload StandupLab APK
        uses: actions/upload-artifact@v4
        with:
          name: StandupLab-Android-APK
          path: output-apk/StandupLab-Android-debug.apk
          retention-days: 30
