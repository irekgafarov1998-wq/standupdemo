name: Build StandupLab Android APK

# Запуск сборки при пуше в основные ветки, PR или вручную
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка Java 17 (требуется для современных Gradle и Android Gradle Plugin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настройка Android SDK Tools и компонентов
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Установка автономного Gradle 8.9
      # Это решает проблему отсутствия локального бинарника gradle-wrapper.jar
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Сборка APK с переходом в подпапку android/
      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle :app:assembleDebug --stacktrace

      # 6. Поиск и перемещение собранного APK в отдельную папку
      - name: Prepare APK Artifact
        run: |
          mkdir -p output-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK файл не найден после сборки!"
            exit 1
          fi
          echo "Найден APK: $APK_PATH"
          cp "$APK_PATH" output-apk/StandupLab-Android-debug.apk

      # 7. Выгрузка APK в раздел Artifacts
      - name: Upload StandupLab APK
        uses: actions/upload-artifact@v4
        with:
          name: StandupLab-Android-APK
          path: output-apk/StandupLab-Android-debug.apk
          retention-days: 30
